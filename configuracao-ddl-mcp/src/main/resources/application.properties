# Porta do servidor
server.port=8081

# Nome da aplicacao
spring.application.name=configuracao-ddl-mcp

# Configuracao do datasource H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Caminho das classes Entity
entity.classes.path=C:/Desenvolvimento/massa-dados-core/entities-core/src/main/java
entity.project.path=C:/Desenvolvimento/massa-dados-core/entities-core
entity.core.project.path=C:/Desenvolvimento/massa-dados-core/entities-core

# Logging
logging.file.name=logs/configuracao-ddl-mcp.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=loggers

# Timeout para requisicoes assincronas (30 minutos)
spring.mvc.async.request-timeout=1800000

# ============================================
# CONFIGURAÇÃO MCP - DESABILITAR O SERVIDOR AUTOMÁTICO
# ============================================

# Desabilita o servidor MCP automático do Spring AI
# Estamos usando nosso controlador adaptativo personalizado
spring.ai.mcp.server.enabled=false

# ============================================
# LOGGING PARA DEBUG
# ============================================

logging.level.org.springframework.web=DEBUG
logging.level.com.thadeu.massa_dados_core=DEBUG